<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kripto Canlı Grafik</title>
  <!-- Telegram Web App kütüphanesi -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #131722; }
    #tradingview_widget { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <!-- TradingView Canlı Widget Kodu -->
  <div class="tradingview-widget-container" style="height:100%;width:100%">
    <div id="tradingview_widget" style="height:calc(100% - 32px);width:100%"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
      new TradingView.widget({
        "autosize": true,
        "symbol": "BINANCE:BTCUSDT",
        "interval": "15",
        "timezone": "Europe/Istanbul",
        "theme": "dark",
        "style": "1",
        "locale": "tr",
        "enable_publishing": false,
        "allow_symbol_change": true,
        "container_id": "tradingview_widget"
      });
      // Telegram Mini App arayüzünü genişlet
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    </script>
  </div>
</body>
</html>
